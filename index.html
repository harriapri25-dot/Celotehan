<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAY Celotehan</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:repeating-linear-gradient(
    to bottom,
    #fdfdfd 0px,
    #fdfdfd 28px,
    #e3e3e3 29px
  );
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  padding:15px;
  text-align:center;
  background:linear-gradient(90deg,#0f172a,#1f2937,#111827);
}

/* TITLE */
.title{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  color:#ff1e1e;
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:0 0 10px rgba(255,0,0,0.6);
}

.title img{
  width:38px;
  height:38px;
  filter: drop-shadow(0 0 6px rgba(255,0,0,0.7));
}

/* WAVE */
.wave{
  display:flex;
  justify-content:space-between;
  height:25px;
  margin-top:10px;
}
.wave span{
  flex:1;
  margin:0 1px;
  background:rgba(255,255,255,0.85);
  border-radius:10px;
  animation:wave 1.2s infinite;
}
.wave span:nth-child(odd){animation-delay:0.2s;}
.wave span:nth-child(even){animation-delay:0.4s;}

@keyframes wave{
  0%,100%{height:6px}
  50%{height:25px}
}

/* CONTAINER */
.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

/* POST BOX */
.post-box{
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  margin-bottom:15px;
}

input, textarea{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ddd;
}

textarea{
  min-height:120px;
  resize:none;
}

.actions{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.btn{
  background:#eee;
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.post-btn{
  background:#0f172a;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
}

/* POST */
.post{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.time{
  font-size:11px;
  color:#777;
}

img{
  width:100%;
  border-radius:10px;
  margin-top:8px;
}

.comment-box{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.comment-box input{
  flex:1;
}

.comment{
  font-size:12px;
  margin-top:4px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="title">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Rolling_Stones_logo.svg">
    <span> HAY Celotehan</span>
  </div>

  <div class="wave">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<div class="container">

<!-- POST FORM -->
<div class="post-box">
  <input id="title" placeholder="Judul postingan...">
  <textarea id="text" placeholder="Tulis sesuatu..."></textarea>

  <div class="actions">
    <label class="btn">
      📷 Upload
      <input type="file" id="image" hidden>
    </label>

    <button id="postBtn" class="post-btn">Posting</button>
  </div>

  <div id="fileInfo" style="font-size:12px;color:#555;margin-top:5px;"></div>
</div>

<div id="posts"></div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  doc, updateDoc, arrayUnion, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

/* 🔥 GANTI CONFIG FIREBASE KAMU */
const firebaseConfig = {
 apiKey: "AIzaSyCuXshySBhgcYMASF1Tu8Fn2M7NyUJ1_7E",
  authDomain: "celotehan-d7306.firebaseapp.com",
  projectId: "celotehan-d7306",
  storageBucket: "celotehan-d7306.firebasestorage.app"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
signInAnonymously(getAuth(app));

const postsDiv = document.getElementById("posts");

const title = document.getElementById("title");
const text = document.getElementById("text");
const fileInput = document.getElementById("image");
const fileInfo = document.getElementById("fileInfo");
const postBtn = document.getElementById("postBtn");

/* FILE NAME */
fileInput.addEventListener("change", ()=>{
  const file = fileInput.files[0];
  fileInfo.innerText = file ? "📄 " + file.name : "";
});

/* POST */
postBtn.onclick = async()=>{
  const t = title.value.trim();
  const tx = text.value.trim();
  const file = fileInput.files[0];

  if(!t && !tx && !file) return;

  postBtn.disabled = true;

  let url = "";

  if(file){
    const r = ref(storage,"posts/"+Date.now()+"_"+file.name);
    await uploadBytes(r,file);
    url = await getDownloadURL(r);
  }

  await addDoc(collection(db,"posts"),{
    title:t,
    text:tx,
    image:url,
    comments:[],
    minimized:false,
    created:new Date().toLocaleString()
  });

  /* RESET */
  title.value="";
  text.value="";
  fileInput.value="";
  fileInfo.innerText="";

  postBtn.disabled = false;
};

/* RENDER */
onSnapshot(collection(db,"posts"),snap=>{
  postsDiv.innerHTML="";

  snap.forEach(d=>{
    const data = d.data();

    postsDiv.innerHTML += `
      <div class="post">
        <div class="top">
          <div>
            <b>${data.title || "Tanpa Judul"}</b>
            <div class="time">${data.created}</div>
          </div>

          <div>
            <button class="btn" onclick="toggle('${d.id}',${data.minimized})">
              ${data.minimized ? "📂" : "📦"}
            </button>
            <button class="btn" onclick="hapus('${d.id}')">🗑️</button>
          </div>
        </div>

        ${!data.minimized ? `
          <p>${data.text || ""}</p>
          ${data.image ? `<img src="${data.image}">` : ""}

          <div class="comment-box">
            <input id="c-${d.id}" placeholder="Komentar...">
            <button onclick="kirim('${d.id}')">Kirim</button>
          </div>

          ${(data.comments || []).map(c=>`<div class="comment">💬 ${c}</div>`).join("")}
        ` : ""}
      </div>
    `;
  });
});

/* ACTION */
window.hapus = id => deleteDoc(doc(db,"posts",id));

window.toggle = async(id,val)=>{
  await updateDoc(doc(db,"posts",id),{
    minimized:!val
  });
};

window.kirim = async(id)=>{
  const input = document.getElementById("c-"+id);
  const val = input.value.trim();
  if(!val) return;

  await updateDoc(doc(db,"posts",id),{
    comments: arrayUnion(val)
  });

  input.value="";
};
</script>

</body>
</html>
