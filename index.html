<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAY Celotehan</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:repeating-linear-gradient(
    to bottom,
    #fdfdfd 0px,
    #fdfdfd 28px,
    #e3e3e3 29px
  );
  color:#172033;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:100;
  padding:14px 18px;
  background:linear-gradient(90deg,#0f172a,#1f2937,#111827);
  box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.title{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  color:#ff2b2b;
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
}

.logo{
  font-size:30px;
}

.wave{
  display:flex;
  justify-content:space-between;
  height:24px;
  margin-top:9px;
}

.wave span{
  flex:1;
  margin:0 1px;
  background:rgba(255,255,255,.85);
  border-radius:10px;
  animation:wave 1.2s infinite;
}

.wave span:nth-child(odd){
  animation-delay:.2s;
}

.wave span:nth-child(even){
  animation-delay:.4s;
}

@keyframes wave{
  0%,100%{height:6px}
  50%{height:24px}
}

/* LOGIN */
#loginPage{
  min-height:calc(100vh - 90px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-box{
  width:min(370px,94vw);
  background:#fff;
  padding:24px;
  border-radius:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.auth-box h2{
  text-align:center;
  margin-top:0;
}

.auth-box input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:11px;
  outline:none;
}

.auth-box input:focus{
  border-color:#64748b;
}

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  padding:12px;
  margin-top:8px;
  background:#0f172a;
  color:white;
  font-weight:700;
}

.secondary{
  border:0;
  background:#eef2f7;
  border-radius:10px;
  padding:9px 12px;
}

.link-btn{
  border:0;
  background:none;
  color:#2563eb;
  font-weight:700;
}

.small{
  font-size:12px;
  color:#64748b;
}

/* GENDER */
.gender-row{
  display:flex;
  gap:10px;
  margin:8px 0;
}

.gender-option{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  padding:11px;
  border-radius:11px;
}

.gender-option.active{
  border-color:#0f172a;
  background:#f1f5f9;
  font-weight:700;
}

/* HOME */
#homePage{
  max-width:650px;
  margin:auto;
  padding:18px;
}

.welcome{
  background:#fff;
  padding:15px;
  border-radius:15px;
  box-shadow:0 5px 14px rgba(0,0,0,.08);
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.user-name{
  font-size:18px;
  font-weight:800;
}

.gender-logo{
  font-size:20px;
}

/* POST BOX */
.post-box{
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 5px 14px rgba(0,0,0,.08);
  margin-bottom:15px;
}

.post-box input,
.post-box textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:11px;
  margin-top:8px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.upload-label,
.post-btn{
  border:0;
  border-radius:20px;
  padding:10px 16px;
  font-weight:700;
}

.upload-label{
  background:#eef2f7;
  display:inline-block;
}

.post-btn{
  background:#0f172a;
  color:#fff;
}

.post-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.file-name{
  font-size:12px;
  color:#64748b;
  margin-top:7px;
  word-break:break-all;
}

/* POST */
.post{
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 5px 14px rgba(0,0,0,.08);
  margin-bottom:15px;
}

.post-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.author{
  font-weight:800;
}

.time{
  font-size:11px;
  color:#777;
  margin-top:3px;
}

.post-actions{
  display:flex;
  gap:5px;
}

.icon-btn{
  border:0;
  background:#eef2f7;
  border-radius:8px;
  padding:6px 9px;
}

.post h3{
  margin:12px 0 6px;
}

.post p{
  white-space:pre-wrap;
  word-break:break-word;
}

.post-media{
  width:100%;
  max-height:520px;
  object-fit:contain;
  border-radius:10px;
  margin-top:8px;
}

.file-link{
  display:block;
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:#f1f5f9;
  color:#2563eb;
  text-decoration:none;
  word-break:break-all;
}

/* COMMENT */
.comment-box{
  display:flex;
  gap:6px;
  margin-top:12px;
}

.comment-box input{
  flex:1;
  min-width:0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
}

.comment-box button{
  border:0;
  background:#0f172a;
  color:white;
  border-radius:10px;
  padding:10px 14px;
}

.comment{
  font-size:13px;
  background:#f8fafc;
  border-radius:9px;
  padding:7px 9px;
  margin-top:6px;
  word-break:break-word;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px;
}

/* TOAST */
#toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:11px 15px;
  border-radius:12px;
  display:none;
  z-index:500;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="title">
    <span class="logo">💬</span>
    <span>HAY Celotehan</span>
  </div>

  <div class="wave">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>


<!-- LOGIN / REGISTER -->
<div id="loginPage">

  <!-- LOGIN -->
  <div id="loginForm" class="auth-box">

    <h2>👋 Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Login
    </button>

    <p style="text-align:center">
      Belum punya akun?
      <button
        class="link-btn"
        onclick="bukaDaftar()"
      >
        Daftar Akun
      </button>
    </p>

  </div>


  <!-- REGISTER -->
  <div
    id="registerForm"
    class="auth-box"
    style="display:none"
  >

    <h2>✨ Buat Akun</h2>

    <input
      type="text"
      id="regName"
      placeholder="Nama Lengkap"
    >

    <input
      type="email"
      id="regEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="regPassword"
      placeholder="Password"
    >

    <input
      type="password"
      id="regConfirm"
      placeholder="Konfirmasi Password"
    >

    <div class="small">
      Pilih gender:
    </div>

    <div class="gender-row">

      <button
        type="button"
        class="gender-option"
        id="genderL"
        onclick="pilihGender('L')"
      >
        ♂️ Laki-laki
      </button>

      <button
        type="button"
        class="gender-option"
        id="genderP"
        onclick="pilihGender('P')"
      >
        ♀️ Perempuan
      </button>

    </div>

    <button
      class="primary"
      onclick="register()"
    >
      Daftar
    </button>

    <p style="text-align:center">
      Sudah punya akun?
      <button
        class="link-btn"
        onclick="kembaliLogin()"
      >
        Login
      </button>
    </p>

    <p
      id="registerMessage"
      class="small"
    ></p>

  </div>

</div>


<!-- HOME -->
<div
  id="homePage"
  style="display:none"
>

  <!-- WELCOME -->
  <div class="welcome">

    <div>

      <div class="small">
        Selamat datang 👋
      </div>

      <div class="user-name">

        <span id="namaUser"></span>

        <span
          id="genderUser"
          class="gender-logo"
        ></span>

      </div>

    </div>

    <button
      class="secondary"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  </div>


  <main>

    <!-- POST FORM -->
    <div class="post-box">

      <input
        id="title"
        placeholder="Judul postingan..."
      >

      <textarea
        id="text"
        placeholder="Tulis sesuatu..."
      ></textarea>

      <div class="actions">

        <label class="upload-label">

          📎 Upload

          <input
            type="file"
            id="image"
            hidden
          >

        </label>

        <button
          id="postBtn"
          class="post-btn"
        >
          Posting
        </button>

      </div>

      <div
        id="namaFile"
        class="file-name"
      >
        Belum ada file dipilih
      </div>

    </div>


    <!-- POSTS -->
    <div id="posts">
      <div class="empty">
        Belum ada celotehan 😌
      </div>
    </div>

  </main>

</div>


<div id="toast"></div>


<!-- FIREBASE -->
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  updateDoc,
  arrayUnion,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
    "AIzaSyCuXshySBhgcYMAS1FTu8Fn2M7NyUJ1_7E",

  authDomain:
    "celotehan-d7306.firebaseapp.com",

  projectId:
    "celotehan-d7306",

  storageBucket:
    "celotehan-d7306.firebasestorage.app"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const auth =
  getAuth(app);


/* ANONYMOUS AUTH */

signInAnonymously(auth)
.catch(error => {

  console.error(
    "Firebase Auth:",
    error
  );

});


/* ELEMENT */

const title =
  document.getElementById("title");

const text =
  document.getElementById("text");

const fileInput =
  document.getElementById("image");

const postBtn =
  document.getElementById("postBtn");

const postsDiv =
  document.getElementById("posts");


/* TOAST */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      () => {
        toast.style.display =
          "none";
      },
      2500
    );

}


/* ESCAPE HTML */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,

    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])

  );

}


/* GENDER ICON */

function genderIcon(gender){

  return gender === "P"
    ? "♀️"
    : "♂️";

}


/* FILE NAME */

fileInput.addEventListener(
  "change",
  () => {

    const file =
      fileInput.files[0];

    document.getElementById(
      "namaFile"
    ).textContent =
      file
        ? "📎 " + file.name
        : "Belum ada file dipilih";

  }
);


/* =========================
   POSTING
========================= */

postBtn.onclick =
async () => {

  const t =
    title.value.trim();

  const tx =
    text.value.trim();

  const file =
    fileInput.files[0];


  if(
    !t &&
    !tx &&
    !file
  ){

    showToast(
      "Isi postingan dulu ya 😄"
    );

    return;

  }


  /* USER */

  const username =
    localStorage.getItem(
      "namaLogin"
    ) ||
    localStorage.getItem(
      "username"
    ) ||
    "Anonim";


  const gender =
    localStorage.getItem(
      "genderLogin"
    ) ||
    "L";


  postBtn.disabled =
    true;

  postBtn.textContent =
    "Mengirim...";


  try{

    let url = "";


    /* CLOUDINARY */

    if(file){

      const formData =
        new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        "Celotehan"
      );


      const res =
        await fetch(

          "https://api.cloudinary.com/v1_1/dhzgp20sw/auto/upload",

          {
            method:"POST",

            body:formData
          }

        );


      const data =
        await res.json();


      console.log(
        "STATUS CLOUDINARY:",
        res.status
      );

      console.log(
        "HASIL CLOUDINARY:",
        data
      );


      if(
        !res.ok ||
        !data.secure_url
      ){

        throw new Error(
          data?.error?.message ||
          "Upload Cloudinary gagal"
        );

      }


      url =
        data.secure_url;


      console.log(
        "URL FILE:",
        url
      );

    }


    /* FIRESTORE */

    await addDoc(
      collection(
        db,
        "posts"
      ),

      {

        username:
          username,

        gender:
          gender,

        title:
          t,

        text:
          tx,

        image:
          url,

        fileName:
          file
            ? file.name
            : "",

        fileType:
          file
            ? file.type
            : "",

        comments:
          [],

        minimized:
          false,

        created:
          new Date()
            .toLocaleString(
              "id-ID"
            )

      }

    );


    /* RESET */

    title.value =
      "";

    text.value =
      "";

    fileInput.value =
      "";

    document.getElementById(
      "namaFile"
    ).textContent =
      "Belum ada file dipilih";


    showToast(
      "Celotehan berhasil diposting 🎉"
    );


  }catch(error){

    console.error(
      "GAGAL POSTING:",
      error
    );

    showToast(
      "Posting gagal: " +
      error.message
    );


  }finally{

    postBtn.disabled =
      false;

    postBtn.textContent =
      "Posting";

  }

};


/* =========================
   RENDER POSTS
========================= */

onSnapshot(

  collection(
    db,
    "posts"
  ),

  snapshot => {

    postsDiv.innerHTML =
      "";


    if(
      snapshot.empty
    ){

      postsDiv.innerHTML =
        `<div class="empty">
          Belum ada celotehan 😌
        </div>`;

      return;

    }


    snapshot.forEach(
      d => {

        const data =
          d.data();


        const gender =
          data.gender ||
          "L";


        /* MEDIA */

        let media =
          "";


        if(
          data.image
        ){

          if(
            (data.fileType || "")
              .startsWith(
                "image/"
              )
          ){

            media =
              `<img
                class="post-media"
                src="${esc(data.image)}"
                alt="file"
              >`;

          }


          else if(
            (data.fileType || "")
              .startsWith(
                "video/"
              )
          ){

            media =
              `<video
                class="post-media"
                controls
                src="${esc(data.image)}"
              ></video>`;

          }


          else if(
            (data.fileType || "")
              .startsWith(
                "audio/"
              )
          ){

            media =
              `<audio
                style="width:100%;margin-top:10px"
                controls
                src="${esc(data.image)}"
              ></audio>`;

          }


          else{

            media =
              `<a
                class="file-link"
                href="${esc(data.image)}"
                target="_blank"
                rel="noopener"
              >
                📄
                ${esc(
                  data.fileName ||
                  "Buka file"
                )}
              </a>`;

          }

        }


        /* COMMENTS */

        const comments =
          (
            data.comments ||
            []
          ).map(

            comment => {

              /*
               * FORMAT BARU
               */

              if(
                typeof comment ===
                "object"
              ){

                return `
                  <div class="comment">

                    💬

                    ${genderIcon(
                      comment.gender
                    )}

                    <b>
                      ${esc(
                        comment.username ||
                        "Anonim"
                      )}
                    </b>

                    :
                    ${esc(
                      comment.text ||
                      ""
                    )}

                  </div>
                `;

              }


              /*
               * FORMAT KOMENTAR LAMA
               */

              return `
                <div class="comment">
                  💬 ${esc(comment)}
                </div>
              `;

            }

          ).join("");


        /* POST */

        postsDiv.innerHTML += `

          <article
            class="post"
          >

            <div
              class="post-header"
            >

              <div>

                <div
                  class="author"
                >

                  ${genderIcon(
                    gender
                  )}

                  ${esc(
                    data.username ||
                    "Anonim"
                  )}

                </div>

                <div
                  class="time"
                >

                  🕒

                  ${esc(
                    data.created ||
                    ""
                  )}

                </div>

              </div>


              <div
                class="post-actions"
              >

                <button
                  class="icon-btn"
                  onclick="
                    togglePost(
                      '${d.id}',
                      ${data.minimized ? "true" : "false"}
                    )
                  "
                >

                  ${
                    data.minimized
                      ? "📂"
                      : "📦"
                  }

                </button>


                <button
                  class="icon-btn"
                  onclick="
                    hapusPost(
                      '${d.id}'
                    )
                  "
                >

                  🗑️

                </button>

              </div>

            </div>


            ${
              !data.minimized

              ? `

                <h3>
                  ${esc(
                    data.title ||
                    "Tanpa Judul"
                  )}
                </h3>


                <p>
                  ${esc(
                    data.text ||
                    ""
                  )}
                </p>


                ${media}


                <div
                  class="comment-box"
                >

                  <input
                    id="c-${d.id}"
                    placeholder="Tulis komentar..."
                  >

                  <button
                    onclick="
                      kirim(
                        '${d.id}'
                      )
                    "
                  >
                    Kirim
                  </button>

                </div>


                ${comments}

              `

              : ""

            }

          </article>

        `;

      }

    );

  },

  error => {

    console.error(
      "Firestore:",
      error
    );

    postsDiv.innerHTML =
      `<div class="empty">
        Gagal mengambil postingan:<br>
        ${esc(error.message)}
      </div>`;

  }

);


/* =========================
   HAPUS
========================= */

window.hapusPost =
async id => {

  if(
    !confirm(
      "Hapus postingan ini?"
    )
  ){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "posts",
        id
      )
    );


    showToast(
      "Postingan dihapus 🗑️"
    );


  }catch(error){

    console.error(
      error
    );

    showToast(
      "Gagal menghapus: " +
      error.message
    );

  }

};


/* =========================
   MINIMIZE
========================= */

window.togglePost =
async (
  id,
  value
) => {

  try{

    await updateDoc(

      doc(
        db,
        "posts",
        id
      ),

      {
        minimized:
          !value
      }

    );

  }catch(error){

    console.error(
      error
    );

    showToast(
      "Gagal mengubah tampilan"
    );

  }

};


/* =========================
   KOMENTAR
========================= */

window.kirim = async function(id) {
  try {

    const input = document.getElementById("c-" + id);

    if (!input) {
      console.error("Input komentar tidak ditemukan:", id);
      return;
    }

    const val = input.value.trim();

    if (!val) return;

    // AMBIL NAMA USER
    const namaKomentar =
      localStorage.getItem("namaLogin") ||
      localStorage.getItem("username") ||
      "Anonim";

    // AMBIL GENDER USER
    const genderKomentar =
      localStorage.getItem("genderLogin") ||
      "L";

    // SIMPAN KOMENTAR
    await updateDoc(
      doc(db, "posts", id),
      {
        comments: arrayUnion({
          username: namaKomentar,
          gender: genderKomentar,
          text: val
        })
      }
    );

    input.value = "";

    console.log("Komentar berhasil dikirim");

  } catch (error) {

    console.error(
      "GAGAL KOMENTAR:",
      error
    );

    alert(
      "Komentar gagal: " +
      error.message
    );

  }
};

</script>


<!-- LOGIN / REGISTER SCRIPT -->
<script>

let selectedGender =
  "";


/* GENDER */

function pilihGender(g){

  selectedGender =
    g;


  document
    .getElementById(
      "genderL"
    )
    .classList.toggle(
      "active",
      g === "L"
    );


  document
    .getElementById(
      "genderP"
    )
    .classList.toggle(
      "active",
      g === "P"
    );

}


/* DAFTAR */

function bukaDaftar(){

  document
    .getElementById(
      "loginForm"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "registerForm"
    )
    .style.display =
      "block";

}


/* LOGIN */

function kembaliLogin(){

  document
    .getElementById(
      "registerForm"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "loginForm"
    )
    .style.display =
      "block";

}


/* REGISTER */

function register(){

  const nama =
    document
      .getElementById(
        "regName"
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        "regEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "regPassword"
      )
      .value;


  const confirm =
    document
      .getElementById(
        "regConfirm"
      )
      .value;


  const pesan =
    document
      .getElementById(
        "registerMessage"
      );


  if(
    !nama ||
    !email ||
    !password
  ){

    pesan.textContent =
      "Data belum lengkap";

    return;

  }


  if(
    password !==
    confirm
  ){

    pesan.textContent =
      "Password tidak sama";

    return;

  }


  if(
    !selectedGender
  ){

    pesan.textContent =
      "Pilih gender dulu ya";

    return;

  }


  const akun = {

    nama:
      nama,

    email:
      email,

    password:
      password,

    gender:
      selectedGender

  };


  localStorage.setItem(
    "akun",
    JSON.stringify(
      akun
    )
  );


  pesan.textContent =
    "Pendaftaran berhasil 🎉";


  setTimeout(

    () => {

      kembaliLogin();

      pesan.textContent =
        "";

    },

    800

  );

}


/* LOGIN */

function login(){

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  const raw =
    localStorage.getItem(
      "akun"
    );


  if(!raw){

    alert(
      "Belum ada akun, silakan daftar dulu."
    );

    return;

  }


  const akun =
    JSON.parse(
      raw
    );


  if(

    email ===
    akun.email &&

    password ===
    akun.password

  ){

    localStorage.setItem(
      "loginStatus",
      "aktif"
    );


    localStorage.setItem(
      "namaLogin",
      akun.nama
    );


    localStorage.setItem(
      "genderLogin",
      akun.gender ||
      "L"
    );


    tampilkanHome(

      akun.nama,

      akun.gender ||
      "L"

    );


  }else{

    alert(
      "Email atau password salah."
    );

  }

}


/* HOME */

function tampilkanHome(
  nama,
  gender
){

  document
    .getElementById(
      "loginPage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "homePage"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "namaUser"
    )
    .textContent =
      nama;


  document
    .getElementById(
      "genderUser"
    )
    .textContent =
      gender === "P"
        ? "♀️"
        : "♂️";

}


/* LOGOUT */

function logout(){

  localStorage.removeItem(
    "loginStatus"
  );

  localStorage.removeItem(
    "namaLogin"
  );

  localStorage.removeItem(
    "genderLogin"
  );


  document
    .getElementById(
      "homePage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "loginPage"
    )
    .style.display =
      "flex";


  document
    .getElementById(
      "loginForm"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "registerForm"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "loginEmail"
    )
    .value =
      "";


  document
    .getElementById(
      "loginPassword"
    )
    .value =
      "";

}


/* AUTO LOGIN */

window.addEventListener(
  "load",
  () => {

    const status =
      localStorage.getItem(
        "loginStatus"
      );


    const nama =
      localStorage.getItem(
        "namaLogin"
      );


    const gender =
      localStorage.getItem(
        "genderLogin"
      ) ||
      "L";


    if(
      status === "aktif" &&
      nama
    ){

      tampilkanHome(
        nama,
        gender
      );

    }

  }
);

</script>

</body>
</html>
